<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Ethiopia - Land Of Origins</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-container">
            <div class="top-bar-left">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <span class="divider">|</span>
                <a href="mailto:info@mot.gov.et" class="email-link"><i class="fa fa-envelope"></i> info@mot.gov.et</a>
            </div>
            <div class="top-bar-right">
                <div class="phone-info">
                    <i class="fa fa-phone-alt"></i>+251 (0) 11 668 4572
                </div>
                <div class="currency-dropdown">
                    USD <i class="fa fa-chevron-down"></i>
                </div>
                <div class="auth-link">
                    <i class="fa fa-user"></i> Sign in or Register
                </div>
            </div>
        </div>
    </div>

    <!--Main Navigation Header-->
    <header class="main-header">
        <div class="header-container">
            <!--Logo-->
            <div class="logo">
                <div class="logo-icon">🌳</div>
                <div class="logo-text">
                    <span class="logo-title">Ethiopia</span>
                    <span class="logo-subtitle">LAND OF ORIGINS</span>
                </div>
            </div>
        </div>
    </header>

    
</body>
</html>
